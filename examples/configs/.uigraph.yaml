version: 1

service:
  name: UIGraph CLI
  category: Backend
  description: CLI for syncing service and API specifications to UiGraph
  repository:
    provider: github
    url: https://gitlab.com/uigraph/uigraph-cli.git

  ownership:
    team: uigraph
    email: team@uigraph.com

  labels:
    - core
    - backend
    - adapter

  integrations:
    slack:
      url: https://uigraph.slack.com/team/U0821234567
    jira:
      url: https://uigraph.atlassian.net/projects/UIG

apis:
  - name: uigraph-cli-openapi-spec
    type: openapi
    path: .uigraph/openapi/storefront-sample.yaml

dependencies:
  - name: gateway-sync-api
    service: UIGraph Gateway
    direction: downstream
    type: http
    criticality: hard
    description: Sends synchronized catalog metadata to the gateway.
    apiGroupName: gateway-sync-api
    apiEndpointNames:
      - SyncCatalog

architectureDiagrams:
  - name: Login Flow
    path: .uigraph/diagrams/login-flow/login-flow.mmd
    contextPath: .uigraph/diagrams/login-flow/context.json
  - name: System Overview
    path: .uigraph/diagrams/system-overview/system-overview.mmd
    contextPath: .uigraph/diagrams/system-overview/context.json

databases:
  - name: ecommerce
    dialect: mysql
    dbType: MySQL
    schemaPath: .uigraph/db/ecommerce-schema.sql
  - name: payments
    dialect: dynamodb
    dbType: DynamoDB
    schemaPath: .uigraph/db/dynamo-schema.json

# Saved queries are synced as team-shared (CI has no personal user context).
# `name` is the stable key used to upsert on repeat syncs — rename it and the
# next sync creates a new query instead of updating this one in place.
# Inline `queries` and external `queryFiles` may be used together; the entries
# are merged. Each file listed under `queryFiles` contains its own `queries:` list.
# All paths (including query `path`) are resolved relative to the working directory.
queries:
  - name: orphaned-orders
    database: ecommerce
    queryText: 'SELECT * FROM orders WHERE customer_id IS NULL'
    tags: [data-quality]

queryFiles:
  - .uigraph/queries/reporting.yaml

testPacks:
  - name: Adapter Smoke
    type: smoke
    # Inline `testCases` and an external `testCasesPath` may be combined; both are
    # merged into this pack. The referenced file contains a `testCases:` list.
    testCases:
      - title: Register user returns 201
        type: api
        order: 1
        apiGroupName: uigraph-cli-openapi-spec
        operationId: registerUser
        expectedStatusCode: 201
      # `screenshots` are reference images for the test case definition. They are
      # keyed by content, so an unchanged image is skipped instead of re-uploaded.
      - title: Login screen renders the SSO button
        type: manual
        order: 2
        screenshots:
          - .uigraph/screenshots/login-sso.png
    testCasesPath: .uigraph/tests/adapter-smoke.yaml

# Cost category tags decide which cloud resources roll up into this service's
# cost dashboard.
# Omitting `costTags` entirely means "not managed by the CLI" — existing rules
# are left alone. Including it means this file owns the full set: a rule in the
# backend that is not listed here is deleted, and `costTags: []` clears them all.
costTags:
  - key: team
    value: uigraph
  - key: Service
    value: uigraph-cli

# Timeline sources scanned on every `uigraph-cli sync`. Each entry is upserted by
# its file path (or version), so editing or retitling a file updates the
# existing event instead of creating a duplicate.
timeline:
  decisions:
    paths:
      - docs/adr/*.md
      - docs/decisions/*.md
  incidents:
    paths:
      - docs/postmortems/*.md
  releases:
    # Fallback only, for repos that do not cut releases through CI. Omit this if
    # your pipeline runs `uigraph-cli release`, or the two sources will compete for
    # the same release event.
    changelogPath: CHANGELOG.md

ml:
  - name: Facebook
    description: Facebook ML models for user behavior prediction.
    type: model
    ownership:
      team: uigraph
      email: team@uigraph.com
    source:
      type: mlflow 
      url: http://localhost:5000
    models:
      - name: Saba
        description: Predicts user behavior based on historical data.

  - name: Facebook Training
    description: Facebook ML training experiments for user behavior prediction.
    type: training
    ownership:
      team: uigraph
      email: team@uigraph.com
    source:
      type: mlflow
      urlEnv: FACEBOOK_MLFLOW_URL
      tokenEnv: FACEBOOK_MLFLOW_TOKEN
    experiments:
      - name: Sample experiment
